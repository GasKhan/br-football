<header class="">
  <div class="flex justify-between items-center p-4 bg-gray-100 relative z-20">
    <h1 class="text-center flex-grow">
      <a href="#" class="text-5xl max-sm:text-3xl font-semibold">{{ title }}</a>
    </h1>
    <nav class="flex max-md:hidden">
      <div class="mr-2">
        <a
          routerLink="/ratings"
          routeerLinkActive="router-link-active"
          class="font-semibold text-lg"
          >Ratings</a
        >
      </div>

      <div class="font-semibold text-lg">
        @if(authService.isAdmin()){
        <a
          routerLink="/admin"
          routeerLinkActive="router-link-active"
          class="font-semibold text-lg mr-2"
          >Admin</a
        >
        <button class="font-semibold text-lg" (click)="logout()">Logout</button>

        }@else {
        <button class="font-semibold text-lg" (click)="openLoginPopup()">
          Login
        </button>
        }
      </div>
    </nav>
    <button (click)="toggleNav()" class="md:hidden size-6">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
        />
      </svg>
    </button>
  </div>
  <nav
    class="md:hidden flex flex-col items-center py-4 px-2 fixed h-full w-full top-16 bg-blue-300 max-w-80 -right-80 z-10"
    [@openCloseNav]="isNavOpen ? 'open' : 'closed'"
  >
    <div class="flex justify-center border-b-2 border-slate-500 w-full py-2">
      <a
        routerLink="/ratings"
        routeerLinkActive="router-link-active"
        class="font-semibold text-lg"
        >Ratings</a
      >
    </div>

    <div class="flex justify-center w-full">
      @if(authService.isAdmin()){
      <div class="flex flex-col items-center justify-center w-full">
        <a
          routerLink="/admin"
          routeerLinkActive="router-link-active"
          class="font-semibold text-lg text-center border-b-2 border-slate-500 w-full py-2"
          >Admin</a
        >
        <button
          class="font-semibold text-lg border-b-2 border-slate-500 w-full py-2"
          (click)="logout()"
        >
          Logout
        </button>
      </div>

      }@else {
      <button class="font-semibold text-lg" (click)="openLoginPopup()">
        Login
      </button>
      }
    </div>
  </nav>
</header>
